[package]
name = "cargo-goose"
description = "Ferrous Goose's cargo subcommand: Goose bindings for a Rust crate, builds, tests and packages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "cargo_goose"
path = "src/lib.rs"

[[bin]]
name = "cargo-goose"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
