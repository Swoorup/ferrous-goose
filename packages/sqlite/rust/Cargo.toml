[package]
name = "goose-rs-sqlite"
description = "rusqlite (SQLite, bundled) as a Goose package"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "goose_rs_sqlite"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
goose.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }

[package.metadata.goose]
namespace = "sqlite"
