[package]
name = "goose-rs-json"
description = "serde_json as a Goose package"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "goose_rs_json"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
goose.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }

[package.metadata.goose]
namespace = "sjson"
